<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>🤖 MAITRI - AI Voice Emotion Analyzer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== Futuristic Background ===== */
      body {
        background: radial-gradient(circle at center, #010a12, #000);
        overflow: hidden;
        height: 100vh;
        margin: 0;
        color: #e0f7fa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Poppins", sans-serif;
      }

      /* Floating Particles */
      .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
      }
      .particle {
        position: absolute;
        background: rgba(0, 255, 200, 0.4);
        border-radius: 50%;
        animation: float 10s infinite ease-in-out;
      }
      @keyframes float {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0.4;
        }
        50% {
          transform: translateY(-40px) scale(1.3);
          opacity: 1;
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.4;
        }
      }

      /* ===== Glass Container ===== */
      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(0, 255, 200, 0.25);
        box-shadow: 0 0 25px rgba(0, 255, 200, 0.15),
          inset 0 0 20px rgba(0, 255, 200, 0.1);
        backdrop-filter: blur(16px);
        padding: 45px;
        border-radius: 25px;
        width: 520px;
        animation: floatBox 6s ease-in-out infinite alternate;
      }

      @keyframes floatBox {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-10px);
        }
      }

      /* ===== Headings ===== */
      h1 {
        font-family: "Orbitron", sans-serif;
        font-size: 1.8rem;
        color: #00ffe1;
        text-shadow: 0 0 15px #00ffe1;
        margin-bottom: 5px;
      }
      p {
        color: #9cf7e9;
        font-size: 0.9rem;
        margin-bottom: 20px;
      }

      /* ===== Button ===== */
      button {
        background: linear-gradient(90deg, #00ffe1, #007d70);
        color: #000;
        border: none;
        padding: 14px 30px;
        font-size: 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: 0.3s;
        box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
      }
      button:hover {
        transform: scale(1.07);
        box-shadow: 0 0 25px #00ffe1;
      }

      /* ===== Status ===== */
      #status {
        margin-top: 25px;
        font-size: 18px;
        font-weight: 500;
        color: #00ffe1;
        text-shadow: 0 0 10px #00ffe1;
      }

      /* ===== Wave animation ===== */
      .wave {
        margin-top: 25px;
        height: 60px;
        display: none;
        justify-content: center;
        align-items: center;
      }
      .bar {
        width: 6px;
        height: 25px;
        margin: 0 3px;
        background: #00ffe1;
        border-radius: 10px;
        animation: bounce 1.2s infinite ease-in-out;
        box-shadow: 0 0 10px #00ffe1;
      }
      .bar:nth-child(1) {
        animation-delay: -1.1s;
      }
      .bar:nth-child(2) {
        animation-delay: -1s;
      }
      .bar:nth-child(3) {
        animation-delay: -0.9s;
      }
      .bar:nth-child(4) {
        animation-delay: -0.8s;
      }
      .bar:nth-child(5) {
        animation-delay: -0.7s;
      }
      .bar:nth-child(6) {
        animation-delay: -0.6s;
      }

      @keyframes bounce {
        0%,
        40%,
        100% {
          transform: scaleY(0.4);
        }
        20% {
          transform: scaleY(1);
        }
      }

      /* ===== Output Box ===== */
      #output {
        margin-top: 30px;
        text-align: left;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(0, 255, 200, 0.2);
        padding: 20px;
        border-radius: 15px;
        font-size: 0.95rem;
        color: #dffdf9;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        animation: fadeIn 0.6s ease-in-out;
        box-shadow: 0 0 15px rgba(0, 255, 200, 0.1);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .emotion-tag {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 10px;
        font-weight: 600;
        color: #000;
        animation: glowPulse 2s infinite alternate;
      }

      @keyframes glowPulse {
        from {
          box-shadow: 0 0 8px #00ffe1;
        }
        to {
          box-shadow: 0 0 18px #00bfa6;
        }
      }

      /* ===== Typing Glow ===== */
      .typing {
        display: inline-block;
        border-right: 2px solid #00ffe1;
        white-space: nowrap;
        overflow: hidden;
        animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
      }
      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
      @keyframes blink {
        50% {
          border-color: transparent;
        }
      }

      /* ===== Hologram Scan Effect ===== */
      #output::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 80%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(0, 255, 200, 0.1),
          transparent
        );
        animation: scan 3s linear infinite;
      }
      @keyframes scan {
        0% {
          left: -100%;
        }
        100% {
          left: 120%;
        }
      }
    </style>
  </head>

  <body>
    <div class="particles" id="particles"></div>

    <div class="container">
      <h1>🤖 MAITRI Emotion Console</h1>
      <p>Speak your thoughts — MAITRI will sense your emotion in real time.</p>

      <button id="startBtn">🎤 Start Listening</button>
      <div id="status">🟢 Idle...</div>

      <div class="wave" id="wave">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div id="output"></div>
    </div>

    <script>
      const particleContainer = document.getElementById("particles");
      for (let i = 0; i < 25; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.width = p.style.height = Math.random() * 6 + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDuration = 5 + Math.random() * 10 + "s";
        particleContainer.appendChild(p);
      }

      const startBtn = document.getElementById("startBtn");
      const statusDiv = document.getElementById("status");
      const outputDiv = document.getElementById("output");
      const wave = document.getElementById("wave");

      // ✨ Smooth typing animation
      const typeLineByLine = async (element, lines, speed = 25) => {
        element.innerHTML = "";
        for (const line of lines) {
          const lineEl = document.createElement("div");
          element.appendChild(lineEl);
          for (let i = 0; i < line.length; i++) {
            lineEl.textContent += line.charAt(i);
            await new Promise((r) => setTimeout(r, speed));
          }
          element.appendChild(document.createElement("br"));
          await new Promise((r) => setTimeout(r, 250));
        }
      };

      startBtn.onclick = async () => {
        statusDiv.textContent = "🎧 Initializing mic...";
        outputDiv.innerHTML = "";
        wave.style.display = "none";

        await fetch("/start", { method: "POST" });
        statusDiv.textContent = "🎙️ Listening... Speak now!";
        wave.style.display = "flex";

        const checkStatus = setInterval(async () => {
          const res = await fetch("/status");
          const data = await res.json();

          if (data.status === "Listening...") return;

          if (data.status === "Analyzing...") {
            wave.style.display = "none";
            statusDiv.textContent = "🧠 MAITRI is analyzing your voice...";
            return;
          }

          if (data.status === "Done") {
            clearInterval(checkStatus);
            wave.style.display = "none";
            statusDiv.textContent = "✅ Emotion Analysis Complete!";

            let parsed;
            try {
              parsed = JSON.parse(data.analysis);
            } catch {
              parsed = null;
            }

            if (parsed) {
              const emotionColor =
                parsed.emotion.toLowerCase() === "happy"
                  ? "#00ffae"
                  : parsed.emotion.toLowerCase() === "sad"
                  ? "#ff4d6d"
                  : "#ffe44d";

              const lines = [
                `🎤 You said: ${data.text || "❌ No speech detected"}`,
                ``,
                `🧠 MAITRI’s Analysis:`,
                `Emotion: ${parsed.emotion}`,
                `Reason: ${parsed.reason}`,
                `💬 MAITRI: ${parsed.maitri_reply}`,
                `✨ Suggestion: ${parsed.suggestion}`,
              ];

              outputDiv.style.fontSize = "0.95rem";
              outputDiv.style.lineHeight = "1.6";
              outputDiv.style.letterSpacing = "0.3px";
              outputDiv.style.color = "#d6f8ff";
              outputDiv.style.fontFamily = "'Poppins', sans-serif";
              outputDiv.innerHTML = ""; // clear

              await typeLineByLine(outputDiv, lines, 25);
            } else {
              outputDiv.innerHTML = `<pre style="color:#00ffe1;">${
                data.analysis || "No analysis available"
              }</pre>`;
            }
          }
        }, 2000);
      };
    </script>
  </body>
</html>
